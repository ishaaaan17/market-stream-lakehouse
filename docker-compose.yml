version: '3.8'

services:
  # High-throughput C++ Kafka-compatible streaming message broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: market_lakehouse_redpanda
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --mode dev-container
      - --smp 1
      - --memory 1G
    ports:
      - "19092:19092"
      - "8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # Redpanda Web Console for Topic & Consumer Group Inspection
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: market_lakehouse_console
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  # S3-compatible Lakehouse Storage Layer
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: market_lakehouse_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Streamlit Real-Time Telemetry Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_lakehouse_dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    depends_on:
      - redpanda
      - minio

volumes:
  redpanda_data:
  minio_data:
