<!-- Card Background -->
<rect width="860" height="580" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

<!-- Title -->
<text x="30" y="44" font-size="22" fill="#e6edf3" font-weight="700">market-stream-lakehouse</text>
<text x="30" y="66" font-size="12" fill="#8b949e">high-throughput streaming · medallion lakehouse · asynchronous compaction · exactly-once semantics</text>

